add_record:
  fields:
    account_id:
      required: true
      example: "3f8e2a6b-9c4d-4e1f-b2a7-5d8c3e9f1a4b"
      selector:
        text:
    amount:
      required: true
      example: -12.50
      selector:
        number:
          mode: box
          step: 0.01
    payment_type:
      required: true
      default: cash
      selector:
        select:
          translation_key: payment_type
          options:
            - cash
            - debit_card
            - credit_card
            - transfer
            - voucher
            - mobile_payment
            - web_payment
    category_id:
      selector:
        text:
    record_date:
      selector:
        datetime:
    note:
      selector:
        text:
    label_ids:
      selector:
        text:
          multiple: true

update_record:
  fields:
    record_id:
      required: true
      selector:
        text:
    amount:
      example: -9.99
      selector:
        number:
          mode: box
          step: 0.01
    payment_type:
      selector:
        select:
          translation_key: payment_type
          options:
            - cash
            - debit_card
            - credit_card
            - transfer
            - voucher
            - mobile_payment
            - web_payment
    category_id:
      selector:
        text:
    record_date:
      selector:
        datetime:
    note:
      selector:
        text:
    label_ids:
      selector:
        text:
          multiple: true

delete_record:
  fields:
    record_id:
      required: true
      selector:
        text:
    force:
      default: false
      selector:
        boolean:

add_transfer:
  fields:
    from_account_id:
      required: true
      selector:
        text:
    to_account_id:
      required: true
      selector:
        text:
    amount:
      required: true
      example: 50
      selector:
        number:
          mode: box
          step: 0.01
    pairing_mode:
      default: new
      selector:
        select:
          translation_key: pairing_mode
          options:
            - new
            - unpaired
    record_date:
      selector:
        datetime:
    note:
      selector:
        text:

manage_budget:
  fields:
    operation:
      required: true
      default: create
      selector:
        select:
          translation_key: operation
          options: [create, patch, delete]
    budget_id:
      selector:
        text:
    name:
      selector:
        text:
    currency_code:
      example: EUR
      selector:
        text:
    type:
      selector:
        select:
          options:
            - BUDGET_INTERVAL_WEEK
            - BUDGET_INTERVAL_MONTH
            - BUDGET_INTERVAL_YEAR
            - BUDGET_CUSTOM
    limit:
      example: 300
      selector:
        number:
          mode: box
          step: 0.01
    category_ids:
      selector:
        text:
          multiple: true
    account_ids:
      selector:
        text:
          multiple: true
    label_ids:
      selector:
        text:
          multiple: true
    start_date:
      selector:
        date:
    end_date:
      selector:
        date:
    closed:
      selector:
        boolean:

manage_category:
  fields:
    operation:
      required: true
      default: create
      selector:
        select:
          translation_key: operation
          options: [create, patch, delete]
    category_id:
      selector:
        text:
    parent_id:
      selector:
        text:
    name:
      selector:
        text:
    cardinality:
      selector:
        select:
          translation_key: cardinality
          options: [none, must, need, want]
    color:
      selector:
        select:
          translation_key: color
          options: &colors
            - Blue
            - Charcoal
            - CoffeeBrown
            - DarkPurple
            - Green
            - LightBlue
            - Lime
            - Orange
            - PineGreen
            - Pink
            - Purple
            - Red
            - Stone
            - Turquoise
            - Wine
            - Yellow

manage_account:
  fields:
    operation:
      required: true
      default: create
      selector:
        select:
          translation_key: operation
          options: [create, patch]
    account_id:
      selector:
        text:
    name:
      selector:
        text:
    account_type:
      selector:
        select:
          options: [General, Cash, CurrentAccount, SavingAccount, Insurance]
    currency_code:
      example: EUR
      selector:
        text:
    initial_balance:
      example: 0
      selector:
        number:
          mode: box
          step: 0.01
    color:
      selector:
        select:
          translation_key: color
          options: *colors
    exclude_from_stats:
      selector:
        boolean:
    archived:
      selector:
        boolean:

manage_label:
  fields:
    operation:
      required: true
      default: create
      selector:
        select:
          translation_key: operation
          options: [create, patch]
    label_id:
      selector:
        text:
    name:
      selector:
        text:
    color:
      selector:
        select:
          translation_key: color
          options: *colors
    archived:
      selector:
        boolean:
